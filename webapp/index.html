<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>RA2 随机地图生成器</title>
<!-- Inline SVG favicon: no extra file, no extra request, no /favicon.ico 404. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230a0b0d'/%3E%3Cpath d='M6 18V6h4.6a3 3 0 0 1 0 6H6m4 0 4 6' fill='none' stroke='%23e0a33a' stroke-width='2.2'/%3E%3C/svg%3E">
<style>
/* ===========================================================================
   RA2 / YR map generator -- instrument-panel styling.

   Direction comes from the ui-ux-pro-max skill's own product classification:
   a developer/utility tool resolves to "Dark Mode (OLED) + Minimalism / Swiss
   Style" with a "Real-Time Monitor + Terminal" dashboard form, and its
   "Terminal CLI Monospace" typography entry, which is explicit about the
   discipline: strict size steps, weight 400 only (bold destroys monospace
   character), tight line height for information density.

   Deliberate rejections, because they are what makes an interface read as
   machine-generated rather than designed:
     - no card soup      -> one continuous surface cut by hairline rules
     - no gradients      -> flat fills only
     - no glows/shadows  -> elevation is a rule colour, not a blur
     - no 16px radii     -> 2px, so it reads as an instrument not a bubble
     - no slate/indigo   -> warm greys + amber; the stock Tailwind palette is
                            the single most recognisable template tell

   It is a tool: dense, quiet, and only the primary action carries colour.
   =========================================================================== */
:root {
  color-scheme: dark;

  /* surfaces -- flat, stepped in luminance, never shadowed */
  --bg:      #0a0b0d;
  --panel:   #101216;
  --panel-2: #16181d;
  --well:    #0c0d10;

  /* rules carry all the structure that cards would otherwise carry */
  --rule:    #23262c;
  --rule-2:  #34383f;

  /* Warm neutrals: an off-white that leans yellow, not blue.  Every value here
     is measured against --panel and --well and clears WCAG AA 4.5:1 for normal
     text -- the dimmer grey this started as (#6a6862) measured 3.37:1, which is
     exactly the "muted normal text" the checklist forbids. */
  --ink:     #e8e6e1;   /* 15.0:1 */
  --ink-2:   #b0aca3;   /*  7.8:1 */
  --ink-3:   #8d8a80;   /*  5.4:1 */

  /* one working accent, plus semantic states.  Used functionally only. */
  --amber:   #e0a33a;
  --amber-2: #f2c069;
  --amber-d: #2a2013;
  --ok:      #7fbf7a;
  --warn:    #d8a83f;
  --err:     #e0715f;

  --mono: ui-monospace, "JetBrains Mono", "SF Mono", "DejaVu Sans Mono",
          Menlo, Consolas, monospace;
  --sans: system-ui, "Helvetica Neue", "Noto Sans SC", "PingFang SC",
          "Microsoft YaHei", Arial, sans-serif;

  --sp: 4px;              /* the whole layout is a multiple of this */
  --focus: 0 0 0 2px var(--bg), 0 0 0 4px var(--amber);
}

* { box-sizing: border-box; }

/* A class with an explicit `display` beats the UA's `[hidden] {display:none}`,
   so .btn[hidden] would stay visible.  Restore the attribute's meaning. */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
}

/* ---- top bar ------------------------------------------------------------- */
.bar {
  display: flex; align-items: stretch; justify-content: space-between;
  gap: 24px; flex-wrap: wrap;
  border-bottom: 1px solid var(--rule);
  background: var(--panel);
  padding: 0 24px;
}
.bar-l { display: flex; align-items: center; gap: 12px; padding: 14px 0; }
.bar-r {
  display: flex; align-items: center; gap: 0;
  font: 400 13px/1 var(--mono); letter-spacing: .08em; color: var(--ink-3);
  text-transform: uppercase;
}
.bar-r span { padding: 0 12px; border-left: 1px solid var(--rule); }
.bar-r span:first-child { border-left: 0; }
.bar-r b { color: var(--ink-2); font-weight: 400; }

.glyph { width: 26px; height: 26px; flex: none; color: var(--amber); }
.glyph svg { width: 100%; height: 100%; display: block; }
h1 {
  margin: 0; font: 400 18px/1 var(--sans);
  letter-spacing: .02em; text-transform: uppercase;
}
h1 b { color: var(--amber); font-weight: 400; }
.tag {
  font: 400 13px/1 var(--mono); letter-spacing: .08em;
  color: var(--ink-3); text-transform: uppercase;
  padding-left: 12px; border-left: 1px solid var(--rule);
}

/* ---- two columns divided by a rule, not by floating cards --------------- */
.wrap { display: grid; grid-template-columns: minmax(0,1fr) 372px; }
@media (max-width: 940px) { .wrap { grid-template-columns: minmax(0,1fr); } }

.col { padding: 0 24px 40px; }
.col-out {
  border-left: 1px solid var(--rule);
  background: var(--panel);
  padding: 0 24px 40px;
}
@media (max-width: 940px) {
  .col-out { border-left: 0; border-top: 1px solid var(--rule); padding-top: 24px; }
}

/* ---- section: uppercase micro-heading over a hairline ------------------- */
.sec { padding-top: 28px; }
.sec:first-child { padding-top: 24px; }
.sec-h {
  display: flex; align-items: baseline; gap: 10px;
  margin: 0 0 16px; padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
  font: 400 12.5px/1.3 var(--mono); letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-2);
}
.sec-h::before {                 /* amber tick: section marker, no badge */
  content: ""; align-self: center; width: 10px; height: 2px;
  background: var(--amber); flex: none;
}
.sec-n { margin-left: auto; color: var(--ink-3); letter-spacing: .1em; }

/* ---- file picker -------------------------------------------------------- */
.pick {
  position: relative; display: block; cursor: pointer;
  border: 1px dashed var(--rule-2);
  background: var(--well);
  padding: 22px 18px; text-align: center;
  transition: border-color .15s linear, background .15s linear;
}
.pick:hover { border-color: var(--amber); background: var(--panel-2); }
.pick:focus-within { outline: none; box-shadow: var(--focus); }
/* The real input stays in the DOM and focusable; only its paint is removed, so
   keyboard users keep a working control and :focus-within shows them where. */
.pick input[type=file] {
  position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;
}
.pick-t {
  display: block; font: 400 16px/1.5 var(--sans); color: var(--ink);
  letter-spacing: .02em;
}
.pick-s {
  display: block; margin-top: 6px;
  font: 400 13px/1.6 var(--mono); letter-spacing: .04em; color: var(--ink-3);
}
.pick-s i { font-style: normal; color: var(--amber); }

/* ---- parameter grid ----------------------------------------------------- */
/* Fixed column counts, not auto-fit: the 1px gap IS the dividing rule, so a
   trailing empty track would expose the container's rule colour as a blank
   block.  The nine fields divide exactly by 3 and by 1. */
.grid {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
}
@media (max-width: 560px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.cell { background: var(--panel); padding: 12px 14px 14px; }
.cell > label {
  display: block; margin-bottom: 7px;
  font: 400 13px/1.35 var(--mono); letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-3);
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
}
.cell output { color: var(--amber); font-variant-numeric: tabular-nums; }

.note {
  margin: 9px 0 0; font: 400 12.5px/1.6 var(--sans); color: var(--ink-3);
}
.note:empty { display: none; }

input, select, button { font: inherit; color: inherit; }

/* Segmented switch (地图大小: 正方形 / 长 × 宽).  Kept to the same 36px row
   height as the other controls so swapping it in does not change the cell's
   height and stretch its neighbours. */
.seg {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  height: 36px; border: 1px solid var(--rule-2); border-radius: 2px;
  overflow: hidden; background: var(--well);
}
.seg button {
  -webkit-appearance: none; appearance: none; cursor: pointer;
  background: transparent; border: 0; border-right: 1px solid var(--rule-2);
  font: 400 12.5px/1 var(--mono); letter-spacing: .06em; color: var(--ink-3);
  transition: color .15s linear, background-color .15s linear;
}
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--ink); }
.seg button.on { color: var(--bg); background: var(--amber); }

/* 长 × 宽 entry: two number inputs on one 36px row. */
.pair { display: grid; grid-template-columns: 1fr 14px 1fr; align-items: center; }
.pair input[type=number] { text-align: center; }
.pair-x { text-align: center; color: var(--ink-3); font: 400 13px/1 var(--mono); }

input[type=number], select {
  width: 100%; height: 36px; padding: 0 10px;
  background: var(--well); color: var(--ink);
  border: 1px solid var(--rule-2); border-radius: 2px;
  font: 400 14px/1 var(--mono);
  transition: border-color .15s linear;
}
input[type=number]:hover, select:hover { border-color: var(--ink-3); }
input[type=number]:focus-visible, select:focus-visible,
input[type=range]:focus-visible, button:focus-visible, a:focus-visible,
.pick:focus-within {
  outline: none; border-color: var(--amber); box-shadow: var(--focus);
}
select {
  -webkit-appearance: none; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%),
                    linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: right 12px center, right 7px center;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 24px;
}

input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 34px; margin: 0; background: transparent; cursor: pointer;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 2px; background: var(--rule-2);
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 11px; height: 18px; margin-top: -8px;
  background: var(--amber); border: 0; border-radius: 1px;
}
input[type=range]::-moz-range-track { height: 2px; background: var(--rule-2); }
input[type=range]::-moz-range-thumb {
  width: 10px; height: 16px; background: var(--amber); border: 0; border-radius: 1px;
}

/* ---- buttons ------------------------------------------------------------ */
.btn {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  width: 100%; height: 44px; padding: 0 16px;
  border: 1px solid var(--rule-2); border-radius: 2px;
  background: var(--panel-2); color: var(--ink);
  font: 400 14px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
  cursor: pointer;
  transition: background .15s linear, border-color .15s linear, color .15s linear;
}
.btn .k { color: var(--ink-3); letter-spacing: 0; }
.btn:hover:not(:disabled) { border-color: var(--amber); color: var(--amber-2); }
.btn:active:not(:disabled) { background: var(--well); }
.btn.primary {
  background: var(--amber); border-color: var(--amber); color: #17120a;
}
.btn.primary .k { color: #4a3a18; }
.btn.primary:hover:not(:disabled) { background: var(--amber-2); border-color: var(--amber-2); color: #17120a; }
/* A disabled control must not merely look dimmer -- on a dark surface a faded
   amber still reads as "press me".  It drops to an inert flat fill. */
.btn:disabled {
  cursor: not-allowed; background: var(--panel); border-color: var(--rule);
  color: var(--ink-3);
}
.btn:disabled .k { color: var(--ink-3); }
.btn + .btn { margin-top: 8px; }
/* side-by-side buttons; .btn + .btn would otherwise stack them */
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.btn-row .btn { flex: 1 1 168px; }
.btn-row .btn + .btn { margin-top: 0; }
#remember .hint { margin-top: 9px; }
#remember b { color: var(--amber-2); font-weight: 400; }

/* ---- status readout ----------------------------------------------------- */
.readout {
  display: flex; align-items: flex-start; gap: 10px;
  margin: 14px 0 0; padding: 9px 11px;
  border: 1px solid var(--rule); border-left: 2px solid var(--rule-2);
  background: var(--well);
  font: 400 14px/1.6 var(--mono); color: var(--ink-2);
}
.readout:empty { display: none; }
.readout.ok  { border-left-color: var(--ok);  color: var(--ok); }
.readout.err { border-left-color: var(--err); color: var(--err); }
.err {
  margin: 10px 0 0; font: 400 14px/1.7 var(--mono); color: var(--err);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.err:empty { display: none; }

/* ---- result ------------------------------------------------------------- */
#result { display: none; margin-top: 14px; }
.row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 12px; border: 1px solid var(--rule); background: var(--well);
}
#done { margin: 0; font: 400 13px/1 var(--mono); color: var(--ok); }
a.dl {
  display: inline-flex; align-items: center; gap: 6px;
  font: 400 13px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase;
  color: var(--amber); text-decoration: none;
  border-bottom: 1px solid transparent; padding-bottom: 2px;
}
a.dl:hover { border-bottom-color: var(--amber); }
a.dl svg { width: 12px; height: 12px; }

/* ---- preview band --------------------------------------------------------
   Full-bleed, below the two columns: a 4380px-wide map rendered into a 372px
   sidebar is a thumbnail, not a preview.  The section heading sits INSIDE
   #preview, so the band does not exist until there is something to show. */
.band {
  border-top: 1px solid var(--rule);
  background: var(--panel);
  padding: 0 24px 48px;
}
#preview { display: none; }
#preview img {
  display: block; width: 100%; height: auto;
  border: 1px solid var(--rule); background: #000;
}
.meta {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 16px; flex-wrap: wrap; margin-top: 10px;
}
.cap { margin: 0; font: 400 13px/1.7 var(--mono); letter-spacing: .03em; color: var(--ink-3); }

/* ---- log ---------------------------------------------------------------- */
.log-h {
  display: flex; align-items: baseline; justify-content: space-between;
  margin: 18px 0 7px;
  font: 400 12.5px/1.3 var(--mono); letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-3);
}
#log {
  margin: 0; padding: 12px 14px; max-height: 230px; overflow: auto;
  background: var(--well); border: 1px solid var(--rule);
  font: 400 13px/1.7 var(--mono); color: var(--ink-3);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
#log:empty::before { content: "-- 引擎输出将显示在此 --"; opacity: .5; }

.hint {
  margin: 12px 0 0; font: 400 13px/1.7 var(--mono);
  letter-spacing: .03em; color: var(--ink-3);
}
#picked:empty { display: none; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-l">
    <span class="glyph" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="square" stroke-linejoin="miter">
        <rect x="2.5" y="2.5" width="19" height="19"></rect>
        <path d="M7.5 17V7h3.6a2.6 2.6 0 0 1 0 5.2H7.5m3.6 0L14.5 17"></path>
      </svg>
    </span>
    <h1>RA2 <b>/</b> YR 随机地图生成器</h1>
    <span class="tag">C++ → WASM · CNCMaps 渲染</span>
  </div>
  <div class="bar-r">
    <span>运行位置 <b>本机浏览器</b></span>
    <span>素材上传 <b>无</b></span>
  </div>
</header>

<div class="wrap">

  <!-- ======================= controls ======================= -->
  <div class="col">

    <section class="sec">
      <h2 class="sec-h">游戏目录<span class="sec-n">01 / 03</span></h2>
      <label class="pick" for="dir">
        <input id="dir" type="file" webkitdirectory directory multiple>
        <span class="pick-t">选择 RA2 / YR 安装目录</span>
        <span class="pick-s">需要 <i>ra2.mix</i> · <i>ra2md.mix</i> · <i>expandmd01.mix</i></span>
      </label>
      <p id="picked" class="hint"></p>

      <!-- Progressive enhancement, hidden unless the browser exposes the File
           System Access API.  The <input webkitdirectory> above keeps working
           everywhere (tools/verify_browser.mjs drives exactly that path); this
           only adds the ability to REMEMBER the folder, which a file input
           cannot do -- its File objects die with the page. -->
      <div id="remember" hidden>
        <div class="btn-row">
          <button type="button" class="btn" id="restore" hidden>
            <span>继续使用 <b id="restore-name"></b></span><span class="k">一键恢复</span>
          </button>
          <button type="button" class="btn ghost" id="pick-remember">
            <span id="pick-remember-label">选择目录并记住</span><span class="k">记住</span>
          </button>
        </div>
        <p class="hint" id="remember-note"></p>
      </div>
    </section>

    <section class="sec">
      <h2 class="sec-h">生成参数<span class="sec-n">02 / 03</span></h2>
      <div class="grid">

        <div class="cell"><label for="land">环境</label>
          <select id="land">
            <option value="0">群岛</option>
            <option value="1" selected>大岛屿</option>
            <option value="2">大岛屿群</option>
            <option value="3">内陆</option>
            <option value="4">山地</option>
          </select>
        </div>

        <div class="cell"><label for="time">时间</label>
          <select id="time">
            <option value="0" selected>早晨</option>
            <option value="1">下午</option>
            <option value="2">黄昏</option>
            <option value="3">夜晚</option>
          </select>
        </div>

        <div class="cell"><label for="theater">剧场</label>
          <select id="theater">
            <option value="0" selected>温带</option>
            <option value="1">雪地</option>
          </select>
        </div>

        <div class="cell"><label for="size">地图大小 <output id="size-out">1</output></label>
          <div class="seg" id="size-mode" role="group" aria-label="尺寸模式">
            <button type="button" data-mode="square" class="on">正方形</button>
            <button type="button" data-mode="rect">长 × 宽</button>
          </div>
          <!-- min/max/step are all replaced by app.js from the engine's
               SizeSliderRange as soon as the worker reports ready; these are just
               a sane pre-boot default.  The value is fractional on purpose. -->
          <input id="size" type="range" min="0" max="3.6" value="1" step="0.1">
          <!-- Non-square maps: CalcMapSize feeds width and height from the same
               tables and the same fraction, so the slider above can only ever
               make a square.  These two override it.  The ceiling is the engine's
               rectMaxSum (width + height), because the 512-cell overlay grid is
               indexed over mapWidth + mapHeight -- the SUM. -->
          <div class="pair" id="rect-pair" hidden>
            <input id="rect-w" type="number" min="1" step="1" value="200" aria-label="长">
            <span class="pair-x">×</span>
            <input id="rect-h" type="number" min="1" step="1" value="200" aria-label="宽">
          </div>
        </div>

        <div class="cell"><label for="players">玩家数</label>
          <select id="players">
            <option>2</option><option>3</option><option>4</option>
            <option>5</option><option>6</option><option>7</option><option>8</option>
          </select>
        </div>

        <div class="cell"><label for="ore">矿量</label>
          <select id="ore">
            <option value="0">低</option>
            <option value="1" selected>中</option>
            <option value="2">高</option>
            <option value="3">极高</option>
          </select>
        </div>

        <div class="cell"><label for="seed">全局种子 · 0 = 随机</label>
          <input id="seed" type="number" value="1" min="0"
                 title="0 = 每次随机；填一个数字即可复现同一张地图">
        </div>

        <div class="cell"><label for="map-seed">地形种子 · 0 = 原版</label>
          <input id="map-seed" type="number" value="0" min="0"
                 title="0 = 原版固定种子 0；换一个数字可在其他参数不变时只换一份地形">
        </div>

        <div class="cell"><label for="symmetry">对称</label>
          <select id="symmetry"
                  title="左右轴对称：把地图沿两轴对调镜像。上下轴对称不提供 —— tileset 里没有它需要的朝向美术（见 engine/src/mirror.h）。">
            <option value="0" selected>无</option>
            <option value="1">左右轴对称</option>
            <option value="2" disabled>180° 中心对称</option>
          </select>
        </div>

        <div class="cell"><label for="kind">地图类型</label>
          <select id="kind">
            <option value="0" selected>多人 .yrm</option>
            <option value="1">单人 .map</option>
          </select>
        </div>

      </div>
      <!-- Outside the grid on purpose: a note inside a cell makes that cell
           taller and stretches every neighbour in the same row. -->
      <p class="note" id="size-note"></p>
    </section>

  </div>

  <!-- ======================= output ======================= -->
  <div class="col col-out">

    <section class="sec">
      <h2 class="sec-h">输出</h2>

      <button id="go" class="btn primary" disabled>
        <span>生成地图</span><span class="k">RUN</span>
      </button>

      <p id="status" class="readout" role="status" aria-live="polite"></p>
      <p id="error" class="err" role="alert"></p>

      <div id="result">
        <div class="row">
          <p id="done"></p>
          <a class="dl" id="download" download>
            下载地图
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="square" aria-hidden="true">
              <path d="M12 3v13M6.5 11 12 16.5 17.5 11M4 20h16"></path>
            </svg>
          </a>
        </div>
        <button id="render" class="btn" type="button">
          <span>渲染预览</span><span class="k">RENDER</span>
        </button>
      </div>

      <div class="log-h"><span>引擎日志</span><span>STDERR</span></div>
      <pre id="log"></pre>
    </section>

  </div>

</div>

<!-- ======================= preview band ======================= -->
